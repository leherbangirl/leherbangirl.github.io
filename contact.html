<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects & Hobbies</a>
    <a href="contact.html">Contact</a>
</nav>

<header>
    <h1>Contact Me</h1>
</header>

<form action="mailto:leherbangirl@gmail.com" method="post">

    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="topic">Reason for Contact:</label><br>

    <select id="topic" name="topic">
        <option>Question</option>
        <option>Feedback</option>
        <option>School Project</option>
        <option>Other</option>
    </select>

    <br><br>

    <fieldset>
        <legend>How did you find my website?</legend>

        <input type="radio" id="friend" name="source">
        <label for="friend">Friend</label>

        <input type="radio" id="school" name="source">
        <label for="school">School</label>

        <input type="radio" id="internet" name="source">
        <label for="internet">Internet</label>

    </fieldset>

    <br>

    <label for="comments">Comments:</label><br>

    <textarea id="comments"
              name="comments"
              rows="6"
              cols="50"></textarea>

    <br><br>

    <input type="submit" value="Submit">

    <input type="reset" value="Reset">

</form>

</body>
</html>
